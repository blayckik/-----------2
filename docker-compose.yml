name: funbox

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-funbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funbox} -d ${POSTGRES_DB:-funbox}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - funbox

  api:
    image: funbox-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BOT_USERNAME: ${BOT_USERNAME}
        VITE_DEMO_MODE: "false"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-funbox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-funbox}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      TELEGRAM_WEBAPP_URL: ${APP_URL}
      TELEGRAM_INIT_TTL_SECONDS: ${TELEGRAM_INIT_TTL_SECONDS:-86400}
      DEMO_AUTH_ENABLED: "false"
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN from @BotFather}
      BOT_USERNAME: ${BOT_USERNAME:?Set BOT_USERNAME}
      BOT_SECRET: ${BOT_SECRET:?Set BOT_SECRET}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      UPLOAD_DIR: /app/apps/api/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-180}
      RUN_MIGRATIONS: "true"
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - uploads:/app/apps/api/uploads
    networks:
      - funbox

  bot:
    image: funbox-app:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["node", "/app/apps/bot/dist/index.js"]
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN from @BotFather}
      BOT_USERNAME: ${BOT_USERNAME:?Set BOT_USERNAME}
      BOT_SECRET: ${BOT_SECRET:?Set BOT_SECRET}
      API_URL: http://api:4000
      WEBAPP_URL: ${APP_URL:?Set APP_URL to the public HTTPS URL}
    networks:
      - funbox

volumes:
  postgres_data:
  uploads:

networks:
  funbox:
    driver: bridge
